name: FactorIA Desktop

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
    paths: ["factoria-desktop/**", ".github/workflows/factoria-desktop.yml"]
  pull_request:
    paths: ["factoria-desktop/**", ".github/workflows/factoria-desktop.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: factoria-desktop

jobs:
  rust:
    name: Núcleo, servidor y shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: factoria-desktop

      # El crate del shell Tauri necesita GTK/WebKit para compilar en Linux.
      - name: Dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Interfaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: factoria-desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    name: Flujo completo en navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: factoria-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: factoria-desktop/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: cargo build -p factoria-server

      # Recorre: detectar PC → catálogo → instalar → ejecutar → chat local.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: factoria-desktop/screenshots/
          if-no-files-found: warn

  enlaces-del-catalogo:
    name: URLs del catálogo y de los motores
    runs-on: ubuntu-latest
    # Comprueba que los orígenes siguen existiendo. No bloquea: un fallo aquí
    # significa que hay que revisar el catálogo, no que el código esté roto.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: HEAD a cada URL
        run: |
          grep -ohE 'https://[^"]+\.(gguf|zip|tar\.gz)' \
            crates/factoria-core/src/catalog/data.rs \
            crates/factoria-core/src/runtime/llamacpp.rs \
            | sort -u | while read -r url; do
              code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
              echo "$code  $url"
              [ "$code" = "200" ] || echo "::warning::$url respondió $code"
            done
